name: Release

# Push a tag like v0.2.0 to publish the Docker image and the sensor programs.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/intrusionsense
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  sensor:
    strategy:
      matrix:
        include:
          - {os: ubuntu-latest, name: linux-x64}
          - {os: windows-latest, name: windows-x64}
          - {os: macos-latest, name: macos-arm64}
          - {os: macos-15-intel, name: macos-x64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash scripts/build-sensor.sh
      - name: Name the file for this platform
        shell: bash
        run: |
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          mv "dist/intrusionsense-sensor$ext" "intrusionsense-sensor-${{ matrix.name }}$ext"
      - uses: actions/upload-artifact@v4
        with:
          name: sensor-${{ matrix.name }}
          path: intrusionsense-sensor-*

  publish:
    needs: [image, sensor]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: sensor-*
          merge-multiple: true
          path: release
      - name: Add the compose file and checksums
        run: |
          # a downloaded compose file has no source to build from, so it only names the published image
          grep -v '^  build: \.$' docker-compose.yml > release/docker-compose.yml
          docker compose -f release/docker-compose.yml config -q
          (cd release && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
